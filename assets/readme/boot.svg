h="513.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#a09c90">[ </tspan><tspan fill="#39ff7e" class="b">OK</tspan><tspan fill="#a09c90"> ] </tspan><tspan fill="#a09c90">indexing community repos ...... 67 repos · 55 cats</tspan></text><text class="ln7" x="44" y="281" font-size="15" textLength="540.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#a09c90">[ </tspan><tspan fill="#ff9900" class="b">!!</tspan><tspan fill="#a09c90"> ] </tspan><tspan fill="#ff9900">scope check .......... written authorisation required</tspan></text><text x="44" y="308" font-size="15" fill="#39ff7e" class="b ln8p">armanxploits@fsociety<tspan fill="#a09c90">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#e8e4d9">$</tspan></text><text class="ln8" x="269.0" y="308" font-size="15" fill="#e8e4d9" textLength="54.0" lengthAdjust="spacingAndGlyphs">whoami</text><text class="ln9" x="44" y="335" font-size="15" textLength="630.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e8e4d9">arman ahemad khan — cs engineer · cyber intern · pentester in progress</tspan></text><text x="44" y="362" font-size="15" fill="#39ff7e" class="b ln10p">armanxploits@fsociety<tspan fill="#a09c90">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#e8e4d9">$</tspan></text><text class="ln10" x="269.0" y="362" font-size="15" fill="#e8e4d9" textLength="99.0" lengthAdjust="spacingAndGlyphs">echo $MOTTO</text><text class="ln11" x="44" y="389" font-size="15" textLength="198.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#ff2d2d" class="b">break · learn · secure</tspan></text><g class="pf"><text x="44" y="416" font-size="15" fill="#39ff7e" class="b">armanxploits@fsociety<tspan fill="#a09c90">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#e8e4d9">$</tspan></text><rect class="blink" x="269.0" y="402" width="9" height="18" fill="#39ff7e"/></g></g>
