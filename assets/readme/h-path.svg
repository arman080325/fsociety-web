<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="02 — the path">
<title>02 — the path</title>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.d{font-family:'Archivo Black','Archivo','Arial Black','Helvetica Neue',Impact,sans-serif;font-weight:900}
.b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes rule{0%{transform:scaleX(0)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.2}}
.rule{transform-box:fill-box;transform-origin:left;animation:rule 6s cubic-bezier(.2,.7,.2,1) infinite both;animation-delay:-0.74s}
@keyframes gh{0%,88%,100%{opacity:0;transform:translate(0,0)}89%{opacity:.85;transform:translate(-4px,1px)}91%{opacity:.85;transform:translate(3px,-1px)}92%{opacity:0}}
.gh{animation:gh 5s steps(1) infinite;animation-delay:-1.48s}
@keyframes dot{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(786px);opacity:0}}
.dot{animation:dot 3.2s linear infinite;animation-delay:-0.74s}
</style>
<text x="4" y="40" font-size="15" fill="#ff2d2d" font-weight="700">// 02</text>
<g class="gh"><text class="" x="78" y="42" font-size="28" fill="#00e5ff" font-weight="700" textLength="134.4" lengthAdjust="spacingAndGlyphs">the path</text></g>
<text class="" x="78" y="42" font-size="28" fill="#e8e4d9" font-weight="700" textLength="134.4" lengthAdjust="spacingAndGlyphs">the path</text>
<rect class="blink" x="218.4" y="20" width="12" height="26" fill="#ff2d2d"/>
<rect class="rule" x="242.4" y="33" width="791.6" height="1.5" fill="#ff2d2d" opacity=".7"/>
<circle class="dot" cx="245.4" cy="33.7" r="2.5" fill="#ff2d2d"/>
<text x="1196" y="38" font-size="12" fill="#67655e" text-anchor="end">eps0.2_clearance.log</text>
